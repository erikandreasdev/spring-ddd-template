openapi: 3.0.3
info:
  title: CHANGEME API
  version: 1.0.0
servers:
  - url: /v1

# Add the endpoints here. One tag (tags) per aggregate: it generates a <Tag>Api interface.
paths: {}

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business rule violated or concurrent update
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?\d+(\.\d{1,4})?$'
          example: '12.50'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: EUR

    PageInfo:
      type: object
      required: [page, size, totalItems]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64

    Problem:
      type: object
      description: RFC 9457
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
