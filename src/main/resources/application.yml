spring:
  application:
    name: CHANGEME
  datasource:
    # CHANGEME: database. In tests and with `mvn spring-boot:test-run` the connection is provided
    # by Testcontainers; these values are only used when running against a real database.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/CHANGEME}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jackson:
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # Builds the *Row records by column name, not by position.
    arg-name-based-constructor-auto-mapping: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  # Traces are only sent if the OTLP endpoint is set through an environment variable:
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://<collector>:4318/v1/traces

# JSON logs outside local, through an environment variable: LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
