name: Copilot Setup Steps

# Prepares the environment of the Copilot cloud agent: Java 21, Maven and the project dependencies.
# Docker is already available on ubuntu-latest, which the integration tests need (Testcontainers).
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q dependency:go-offline
